  <body>
  <html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Emilys+Candy&family=Roboto:wght@400;500&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="style.css">

  <title>Widget</title>
</head>

<body>

  <div class="widget-wrapper">

    <!-- Navigation Buttons -->
    <div class="nav-buttons-container">

      <!-- Sliding Gradient -->
      <div class="sliding-gradient-bg"></div>

      <button type="button" class="nav-btn">
        PERSONAL
      </button>

      <button type="button" class="nav-btn active-tab">
        CORTIS
      </button>

      <button type="button" class="nav-btn">
        REALITY
      </button>

    </div>

    <!-- Search Bar -->
    <form id="searchForm" class="search-bar-form">

      <div class="input-wrapper">

        <span class="search-icon">🍧</span>

        <input
          type="text"
          id="searchInput"
          placeholder="SEARCH..."
          autocomplete="off"
        >

      </div>

      <button type="submit" class="submit-search-btn">
        SEARCH
      </button>

    </form>

  </div>

  <!-- JS -->
  <script src="script.js"></script>

</body>
</html>
    <script  src="./script.js"></script>

  </body>
  
</html>
